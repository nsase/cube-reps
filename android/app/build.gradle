import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// 表示バージョンはWeb版と共通にし、配布ごとの通し番号は環境変数から指定する。
def appPackage = new JsonSlurper().parse(file('../../package.json'))
def releaseCode = System.getenv('ANDROID_VERSION_CODE')
if (releaseCode && (!(releaseCode ==~ /[1-9][0-9]*/) || releaseCode.size() > 10 || releaseCode.toLong() > 2100000000)) {
    throw new GradleException('ANDROID_VERSION_CODE must be a positive integer, max 2100000000.')
}
def signingValues = ['ANDROID_KEYSTORE_PATH', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD'].collectEntries { [(it): System.getenv(it)] }

android {
    namespace = "io.github.nsase.cubereps"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.nsase.cubereps"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode releaseCode ? releaseCode.toInteger() : 1
        versionName appPackage.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (signingValues.values().every { it }) {
                storeFile file(signingValues.ANDROID_KEYSTORE_PATH)
                storePassword signingValues.ANDROID_KEYSTORE_PASSWORD
                keyAlias signingValues.ANDROID_KEY_ALIAS
                keyPassword signingValues.ANDROID_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// 設定不備を握りつぶさず、ファイルが存在する場合はGoogle Servicesで検証する。
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

// 開発用APKを誤って配布しないよう、releaseでは認証設定と署名を必須にする。
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') }) {
        if (!releaseCode || !(releaseCode ==~ /[1-9][0-9]*/) || releaseCode.toLong() > 2100000000) {
            throw new GradleException('Set ANDROID_VERSION_CODE to a positive, increasing Play version code (max 2100000000).')
        }
        if (!signingValues.values().every { it }) {
            throw new GradleException('Set ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD.')
        }
        def pluginFile = file('src/main/assets/capacitor.plugins.json')
        def hasFirebase = pluginFile.exists() && new JsonSlurper().parse(pluginFile).any { it.pkg == '@capacitor-firebase/authentication' }
        if (!file('google-services.json').exists() || !hasFirebase) {
            throw new GradleException('Configure Firebase Android and run npm run android:sync before a release build.')
        }
    }
}
