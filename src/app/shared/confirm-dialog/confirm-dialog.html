@if (data.title) {
  <h2 mat-dialog-title>{{ data.title }}</h2>
}

<mat-dialog-content>{{ data.message }}</mat-dialog-content>

<mat-dialog-actions align="end">
  @for (button of data.buttons; track button.id) {
    @if (button.id === data.defaultFocus) {
      <button
        type="button"
        mat-button
        cdkFocusInitial
        [color]="button.color"
        [mat-dialog-close]="button.id"
      >
        {{ button.labelKey | transloco }}
      </button>
    } @else {
      <button type="button" mat-button [color]="button.color" [mat-dialog-close]="button.id">
        {{ button.labelKey | transloco }}
      </button>
    }
  }
</mat-dialog-actions>
