<span matSnackBarLabel>{{ 'app.updateAvailable' | transloco }}</span>
<span matSnackBarActions>
  <button mat-button type="button" (click)="applyUpdate()">
    {{ 'app.updateNow' | transloco }}
  </button>
  <button
    mat-icon-button
    type="button"
    (click)="dismiss()"
    [attr.aria-label]="'app.dismissUpdate' | transloco"
    [title]="'app.dismissUpdate' | transloco"
  >
    <mat-icon>close</mat-icon>
  </button>
</span>
