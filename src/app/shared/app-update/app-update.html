@if (updates.updateAvailable()) {
  <aside class="update-notice" role="status" data-testid="update-notice">
    <span>{{ 'app.updateAvailable' | transloco }}</span>
    <button mat-flat-button type="button" (click)="updates.applyUpdate()">
      {{ 'app.updateNow' | transloco }}
    </button>
  </aside>
}
