<button mat-flat-button class="create-toggle" (click)="showForm.set(!showForm())">
  <mat-icon aria-hidden="true">add</mat-icon>
  {{ 'history.newGroup' | transloco }}
</button>
@if (showForm()) {
  <form class="group-form" (submit)="$event.preventDefault(); createGroup()">
    <label
      >{{ 'history.groupName' | transloco
      }}<input [(ngModel)]="groupName" name="groupName" autofocus
    /></label>
    <button mat-flat-button type="submit" [disabled]="!groupName().trim()">
      {{ 'history.create' | transloco }}
    </button>
    <button mat-button type="button" (click)="cancel()">{{ 'common.cancel' | transloco }}</button>
  </form>
}
