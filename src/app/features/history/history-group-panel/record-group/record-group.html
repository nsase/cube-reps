<button class="group-main" (click)="select()">
  <span class="group-icon">●</span>
  <span
    ><strong>{{ group().name }}</strong
    ><small>{{ solveCount() }}回</small></span
  >
</button>
<button
  mat-icon-button
  class="group-delete"
  [disabled]="!canDelete()"
  aria-label="グループを削除"
  title="グループを削除"
  (click)="delete()"
>
  <mat-icon>delete</mat-icon>
</button>
