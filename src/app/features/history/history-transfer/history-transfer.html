@if (store.auth.user()) {
  <div class="operations">
    <span>{{ 'ownership.selected' | transloco: { count: store.selectedSolves().length } }}</span>
    <button
      mat-button
      [disabled]="!guestSolves().length || confirming() || migration.pending()"
      (click)="move()"
    >
      {{ 'ownership.move' | transloco }}
    </button>
    <button
      mat-button
      [disabled]="!accountSolves().length || confirming() || migration.pending()"
      (click)="copy()"
    >
      {{ 'ownership.copy' | transloco }}
    </button>
  </div>
}
@if (result(); as outcome) {
  <div role="status" data-testid="history-transfer-result">
    <span>{{ 'ownership.result' | transloco: outcome }}</span>
    <button mat-button (click)="result.set(null)">{{ 'common.close' | transloco }}</button>
  </div>
}
