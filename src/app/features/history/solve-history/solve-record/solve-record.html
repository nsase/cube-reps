<span class="record-number">{{ recordNumber() }}</span>
<div class="result">
  <strong>{{ cube.displayTime(solve()) }}</strong>
</div>
<span class="average ao5">{{ formatAverage(ao5()) }}</span>
<span class="average ao12">{{ formatAverage(ao12()) }}</span>
<time>{{ solve().date | date: 'MM/dd HH:mm' }}</time>
<span class="group-badge">{{ cube.groupName(solve().groupId) }}</span>
<div class="row-actions">
  <button
    mat-icon-button
    class="row-details"
    [attr.aria-label]="'history.viewSolveDetails' | transloco"
    [title]="'history.viewSolveDetails' | transloco"
    (click)="showDetails()"
  >
    <mat-icon>info</mat-icon>
  </button>
  <app-solve-actions [solve]="solve()" />
</div>
