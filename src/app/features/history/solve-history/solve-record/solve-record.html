<span>#{{ recordNumber() }}</span>
<div>
  <strong>{{ cube.displayTime(solve()) }}</strong
  ><small>{{ solve().mode }}{{ solve().caseName ? ' · ' + solve().caseName : '' }}</small>
</div>
<code>{{ solve().scramble }}</code>
<app-cube-net
  [scramble]="solve().scramble"
  [orientation]="solve().mode === 'PLL' ? 'yellow-top' : 'white-top'"
/>
<time>{{ solve().date | date: 'MM/dd HH:mm' }}</time>
<div class="row-actions">
  <span class="group-badge">{{ cube.groupName(solve().groupId) }}</span
  ><button
    mat-button
    [class.on]="solve().penalty === '+2'"
    (click)="cube.togglePenalty(solve().id, '+2')"
  >
    +2</button
  ><button
    mat-button
    [class.on]="solve().penalty === 'DNF'"
    (click)="cube.togglePenalty(solve().id, 'DNF')"
  >
    DNF</button
  ><button
    mat-icon-button
    class="row-delete"
    aria-label="計測記録を削除"
    title="計測記録を削除"
    (click)="delete()"
  >
    <mat-icon>delete</mat-icon>
  </button>
</div>
