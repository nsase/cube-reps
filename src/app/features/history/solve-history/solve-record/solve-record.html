<span>#{{ recordNumber() }}</span>
<div>
  <strong>{{ cube.displayTime(solve()) }}</strong
  ><small
    >{{ 'solveCategories.' + solve().category | transloco
    }}{{ solve().caseName ? ' · ' + solve().caseName : '' }}</small
  >
</div>
<code>{{ solve().scramble }}</code>
<app-solve-pattern [category]="solve().category" [scramble]="solve().scramble" />
<time>{{ solve().date | date: 'MM/dd HH:mm' }}</time>
<div class="row-actions">
  <span class="group-badge">{{ cube.groupName(solve().groupId) }}</span
  ><button
    mat-button
    [class.on]="solve().penalty === '+2'"
    (click)="cube.togglePenalty(solve().id, '+2')"
  >
    +2</button
  ><button
    mat-button
    [class.on]="solve().penalty === 'DNF'"
    (click)="cube.togglePenalty(solve().id, 'DNF')"
  >
    DNF</button
  ><button
    mat-icon-button
    class="row-delete"
    [attr.aria-label]="'history.deleteSolve' | transloco"
    [title]="'history.deleteSolve' | transloco"
    (click)="delete()"
  >
    <mat-icon>delete</mat-icon>
  </button>
</div>
