<div class="history">
  <div class="history-title">
    <small>{{ 'history.solveHistory' | transloco }}</small>
    <h2>{{ 'history.records' | transloco }}</h2>
  </div>
  @for (solve of store.filteredSolves(); track solve.id; let index = $index) {
    <app-solve-record [solve]="solve" [recordNumber]="store.filteredSolves().length - index" />
  } @empty {
    <div class="empty">
      <b>{{ 'history.emptyTitle' | transloco }}</b
      ><span>{{ 'history.emptyDescription' | transloco }}</span
      ><a mat-flat-button routerLink="/timer">{{ 'history.goToTimer' | transloco }}</a>
    </div>
  }
</div>
