<div class="history-filter">
  <label
    >表示する記録<select [(ngModel)]="store.selectedGroup">
      <option value="all">すべてのグループ</option>
      @for (group of cube.groups(); track group.id) {
        <option [value]="group.id">{{ group.name }}</option>
      }
    </select></label
  >
</div>
<div class="summaries">
  <article>
    対象ソルブ<strong>{{ store.filteredSolves().length }}</strong>
  </article>
  <article>
    ベスト<strong>{{ cube.formatTime(best()) }}</strong>
  </article>
  <article>
    直近5回 平均<strong>{{ cube.formatTime(average()) }}</strong>
  </article>
</div>
