<div class="history-filter">
  <label
    >{{ 'history.solveCategory' | transloco
    }}<select [(ngModel)]="store.selectedCategory">
      @for (category of solveCategories; track category.id) {
        <option [value]="category.id">{{ category.labelKey | transloco }}</option>
      }
    </select></label
  >
  <label
    >{{ 'history.recordFilter' | transloco
    }}<select [(ngModel)]="store.selectedGroup">
      <option value="all">{{ 'history.allGroups' | transloco }}</option>
      @for (group of cube.groups(); track group.id) {
        <option [value]="group.id">{{ cube.groupName(group.id) }}</option>
      }
    </select></label
  >
</div>
<div class="summaries">
  <article>
    {{ 'common.best' | transloco }}<strong>{{ cube.formatTime(best()) }}</strong>
  </article>
  <article>
    {{ 'common.mean' | transloco }}<strong>{{ formatStatistic(mean()) }}</strong>
  </article>
  <article>
    AO5<strong>{{ formatStatistic(ao5()) }}</strong>
  </article>
  <article>
    AO12<strong>{{ formatStatistic(ao12()) }}</strong>
  </article>
  <article>
    AO50<strong>{{ formatStatistic(ao50()) }}</strong>
  </article>
  <article>
    AO100<strong>{{ formatStatistic(ao100()) }}</strong>
  </article>
</div>
