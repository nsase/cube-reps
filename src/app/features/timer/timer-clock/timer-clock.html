<div
  class="clock"
  [class.holding]="store.state() === 'holding'"
  [class.ready]="store.state() === 'ready'"
  (pointerdown)="store.press()"
  (pointerup)="store.release()"
  (pointercancel)="store.cancelPress()"
>
  <small>{{
    (store.state() === 'holding'
      ? 'timer.keepHolding'
      : store.state() === 'ready'
        ? 'timer.releaseToStart'
        : store.state() === 'running'
          ? 'timer.tapToStop'
          : 'timer.holdSpace'
    ) | transloco
  }}</small>
  <strong>{{ cube.formatTime(store.elapsed()) }}</strong
  ><i>━━ SPACE ━━</i>
</div>
@if (store.completedSolve()) {
  <app-timer-solve-actions />
}
