<section aria-labelledby="website-links-heading">
  <h2 id="website-links-heading">{{ 'settings.linksTitle' | transloco }}</h2>
  <p>{{ 'settings.linksHint' | transloco }}</p>
  <div class="links">
    <a
      mat-button
      href="https://nsase.github.io/cube-reps/"
      target="_blank"
      rel="noopener noreferrer"
    >
      {{ 'settings.openWebsite' | transloco }}
      <mat-icon aria-hidden="true">open_in_new</mat-icon>
    </a>
    <a
      mat-button
      href="https://github.com/nsase/cube-reps"
      target="_blank"
      rel="noopener noreferrer"
    >
      {{ 'settings.openGithub' | transloco }}
      <mat-icon aria-hidden="true">open_in_new</mat-icon>
    </a>
  </div>
</section>
