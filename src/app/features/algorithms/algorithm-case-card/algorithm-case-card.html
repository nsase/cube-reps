<mat-card>
  <mat-card-header>
    <mat-card-title>
      @if (item().kind === 'F2L') {
        <app-cube-quarter-view
          [pattern]="quarterPattern()"
          [label]="'algorithms.quarterPattern' | transloco: { name: item().name }"
        />
      } @else {
        <app-cube-pattern
          [pattern]="pattern()"
          [label]="'algorithms.pattern' | transloco: { name: item().name }"
        />
      }
      <div class="info">
        <div class="number">
          <div class="number">{{ item().number }}</div>
          <div class="group">{{ item().group }}</div>
        </div>
        @if (item().name) {
          <div class="name">{{ item().name }}</div>
        }
        <code class="setup">{{ 'algorithms.setup' | transloco }}: {{ item().setup }}</code>
      </div>
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <app-algorithm-panel [item]="item()" />
  </mat-card-content>
</mat-card>
