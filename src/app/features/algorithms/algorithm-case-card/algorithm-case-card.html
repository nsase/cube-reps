<div class="casehead">
  <b>{{ item().number }}</b
  ><small>{{ item().kind }}</small>
</div>
<app-cube-pattern
  [pattern]="item().pattern"
  [label]="'algorithms.pattern' | transloco: { name: item().name }"
/>
<div>
  <h2>{{ item().aliases?.join(' / ') ?? item().name }}</h2>
  <p>{{ item().group }}</p>
</div>
<app-algorithm-panel [item]="item()" />
