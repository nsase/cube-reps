<app-algorithm-owner [algorithm]="algorithm()" />
<code>{{ algorithm().notation }}</code>
<div class="algorithm-actions">
  <button
    mat-icon-button
    class="star"
    [class.active]="library.isDisplayedFavorite(item(), algorithm())"
    [attr.aria-label]="
      (library.isDisplayedFavorite(item(), algorithm())
        ? 'algorithms.favorite'
        : 'algorithms.makeFavorite'
      ) | transloco
    "
    [title]="
      (library.isDisplayedFavorite(item(), algorithm())
        ? 'algorithms.favorite'
        : 'algorithms.makeFavorite'
      ) | transloco
    "
    (click)="library.setDisplayedFavorite(item(), algorithm())"
  >
    <mat-icon>{{
      library.isDisplayedFavorite(item(), algorithm()) ? 'star' : 'star_border'
    }}</mat-icon>
  </button>
  <button
    mat-icon-button
    [attr.aria-label]="(copied() ? 'algorithms.copied' : 'algorithms.copy') | transloco"
    [title]="(copied() ? 'algorithms.copied' : 'algorithms.copy') | transloco"
    (click)="copy()"
  >
    <mat-icon>{{ copied() ? 'check' : 'content_copy' }}</mat-icon>
  </button>
  @if (!algorithm().builtIn) {
    <button
      mat-icon-button
      class="remove"
      [attr.aria-label]="'algorithms.removeUserAlgorithm' | transloco"
      [title]="'common.delete' | transloco"
      (click)="remove()"
    >
      <mat-icon>delete</mat-icon>
    </button>
  }
</div>
