<mat-button-toggle-group
  (change)="navigate($event.value)"
  [attr.aria-label]="'nav.algorithms' | transloco"
>
  <mat-button-toggle
    value="f2l"
    [class.on]="currentUrl() === '/algorithms/f2l'"
    [checked]="currentUrl() === '/algorithms/f2l'"
    >F2L <small>41</small></mat-button-toggle
  >
  <mat-button-toggle
    value="oll"
    [class.on]="currentUrl() === '/algorithms/oll'"
    [checked]="currentUrl() === '/algorithms/oll'"
    >OLL <small>57</small></mat-button-toggle
  >
  <mat-button-toggle
    value="pll"
    [class.on]="currentUrl() === '/algorithms/pll'"
    [checked]="currentUrl() === '/algorithms/pll'"
    >PLL <small>21</small></mat-button-toggle
  >
</mat-button-toggle-group>
