<div class="shell">
  <aside>
    <a class="brand" routerLink="/timer">
      <img class="app-logo" src="cube-reps-mark.svg" alt="" width="34" height="34" />
      <div class="app-name">Cube <span>Reps</span></div>
    </a>
    <app-nav />
  </aside>
  <main>
    <header>
      <h1>{{ headingKey() | transloco }}</h1>
      <div class="header-tools">
        @defer {
          <app-sync-status />
        }
        <app-auth-controls />
      </div>
    </header>
    <div class="route-content">
      <router-outlet />
    </div>
  </main>
</div>
<app-update />
