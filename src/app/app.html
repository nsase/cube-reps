<div class="shell">
  <aside>
    <a class="brand" routerLink="/timer">
      <img src="cube-reps-mark.svg" alt="" width="34" height="34" />
      Cube<span>Reps</span>
    </a>
    <nav>
      <a routerLink="/timer" routerLinkActive="on" [attr.aria-label]="'nav.timer' | transloco"
        >⏱ <em>{{ 'nav.timer' | transloco }}</em></a
      >
      <a routerLink="/algorithms" routerLinkActive="on">▦ <em>OLL / PLL</em></a>
      <a routerLink="/history" routerLinkActive="on" [attr.aria-label]="'nav.history' | transloco"
        >↗ <em>{{ 'nav.history' | transloco }}</em></a
      >
      <a
        routerLink="/settings"
        routerLinkActive="on"
        data-testid="settings-link"
        [attr.aria-label]="'nav.settings' | transloco"
        >⚙ <em>{{ 'nav.settings' | transloco }}</em></a
      >
    </nav>
    <div class="today">
      {{ 'nav.totalSolves' | transloco }} <strong>{{ cube.activeSolves().length }}</strong>
    </div>
  </aside>
  <main>
    <header>
      <h1>{{ headingKey() | transloco }}</h1>
      <div class="header-tools">
        @defer {
          <app-sync-status />
        }
        <app-auth-controls />
      </div>
    </header>
    <div class="route-content">
      <router-outlet />
    </div>
  </main>
</div>
<app-update />
