<div class="shell">
  <aside>
    <a class="brand" routerLink="/timer">
      <img src="cube-reps-mark.svg" alt="" width="34" height="34" />
      Cube<span>Reps</span>
    </a>
    <nav>
      <a routerLink="/timer" routerLinkActive="on"
        >⏱ <em>{{ 'nav.timer' | transloco }}</em></a
      >
      <a routerLink="/algorithms" routerLinkActive="on">▦ <em>OLL / PLL</em></a>
      <a routerLink="/history" routerLinkActive="on"
        >↗ <em>{{ 'nav.history' | transloco }}</em></a
      >
    </nav>
    <div class="today">
      {{ 'nav.totalSolves' | transloco }} <strong>{{ cube.solves().length }}</strong>
    </div>
  </aside>
  <main>
    <header>
      <h1>{{ headingKey() | transloco }}</h1>
      <div class="header-tools">
        <p>● {{ 'app.offline' | transloco }}</p>
        <label>
          <span class="visually-hidden">{{ 'app.language' | transloco }}</span>
          <select
            [value]="i18n.getActiveLang()"
            (change)="setLanguage($any($event.target).value)"
            [attr.aria-label]="'app.language' | transloco"
          >
            <option value="en">English</option>
            <option value="ja">日本語</option>
          </select>
        </label>
      </div>
    </header>
    <div class="route-content">
      <router-outlet />
    </div>
  </main>
</div>
<app-update />
