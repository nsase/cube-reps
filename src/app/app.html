<div class="shell">
  <aside>
    <a class="brand" (click)="navigate('timer')"
      ><b><i></i><i></i><i></i><i></i></b>Cube<span>Flow</span></a
    >
    <nav>
      <button [class.on]="view() === 'timer'" (click)="navigate('timer')">
        ⏱ <em>タイマー</em>
      </button>
      <button [class.on]="view() === 'algorithms'" (click)="navigate('algorithms')">
        ▦ <em>OLL / PLL</em>
      </button>
      <button [class.on]="view() === 'history'" (click)="navigate('history')">
        ↗ <em>記録</em>
      </button>
    </nav>
    <div class="today">
      今日のソルブ <strong>{{ cube.solves().length }}</strong>
    </div>
  </aside>
  <main>
    <header>
      <div>
        <small>{{ headings[view()].eyebrow }}</small>
        <h1>{{ headings[view()].title }}</h1>
      </div>
      <p>● オフライン保存</p>
    </header>
    @switch (view()) {
      @case ('timer') {
        <app-timer (showHistory)="navigate('history')" />
      }
      @case ('algorithms') {
        <app-algorithms />
      }
      @case ('history') {
        <app-history (showTimer)="navigate('timer')" />
      }
    }
  </main>
</div>
